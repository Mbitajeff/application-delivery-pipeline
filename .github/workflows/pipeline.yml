# =============================================================================
# Main CI/CD Pipeline — runs on push to main
# =============================================================================
#
# Job execution order:
#   pre-flight (Gitleaks + lint)
#       │
#       ├── sast (Semgrep)      ─┐
#       ├── sca (Trivy fs)      ─┤── all three parallel
#       └── iac-scan (Checkov)  ─┘
#                │
#           test (pytest + coverage)
#                │
#           build (Docker multi-stage)
#                │
#       ┌────────┴────────┐
#   image-scan         sbom-sign
#   (Trivy image)   (Syft + Cosign)
#       └────────┬────────┘
#            push (GHCR)
#                │
#             dast (ZAP)
#                │
#         deploy-gate (manual approval)
#
# Note on action versions:
#   Actions use verified version tags rather than fabricated SHAs.
#   For highest security, pin to commit SHAs after verifying them at
#   github.com/ACTION/releases — see docs/PIPELINE.md.
#   The trivy-action uses v0.36.0, the first clean release after the
#   March 2026 supply chain compromise (CVE-2026-33634).
# =============================================================================

name: Secure Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PYTHON_VERSION: "3.12"

jobs:
  # ===========================================================================
  # Job 1: Pre-flight — secrets + lint
  # ===========================================================================
  pre-flight:
    name: Pre-flight (Secrets + Lint)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout (full history for secret scan)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: security/.gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Ruff
        run: pip install ruff==0.17.4

      - name: Lint (Ruff)
        run: ruff check app/

  # ===========================================================================
  # Jobs 2–4: Parallel security analysis
  # ===========================================================================
  sast:
    name: SAST (Semgrep)
    needs: pre-flight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/owasp-top-ten
            p/python
            p/jwt
            security/.semgrep.yml
          generateSarif: "1"
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true

  sca:
    name: SCA (Trivy — dependencies)
    needs: pre-flight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Using v0.36.0 — first clean release after CVE-2026-33634 supply chain attack
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: sarif
          output: trivy-sca.sarif
          ignore-unfixed: true

      - name: Upload Trivy SCA SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-sca.sarif
          category: trivy-sca
        continue-on-error: true

  iac-scan:
    name: IaC Scan (Checkov)
    needs: pre-flight
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infrastructure/
          config_file: security/checkov-config.yaml
          framework: terraform,kubernetes
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
          soft_fail: false

      - name: Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov.sarif
          category: checkov
        continue-on-error: true

  # ===========================================================================
  # Job 5: Tests + coverage gate
  # ===========================================================================
  test:
    name: Tests + Coverage
    needs: [sast, sca, iac-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

  # ===========================================================================
  # Job 6: Docker build
  # ===========================================================================
  build:
    name: Docker Build
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - name: Build Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  # Jobs 7a + 7b: Image scan and SBOM+sign (parallel)
  # ===========================================================================
  image-scan:
    name: Image Scan (Trivy)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Rebuild image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: scan-target:latest
          cache-from: type=gha

      # Using v0.36.0 — first clean release after CVE-2026-33634
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: scan-target:latest
          scanners: vuln
          severity: CRITICAL
          exit-code: "1"
          format: table
          output: trivy-image.txt
          ignore-unfixed: true
          trivy-config: ""

      - name: Show Trivy results
        if: always()
        run: cat trivy-image.txt || true

      - name: Trivy image scan (SARIF for Security tab)
        uses: aquasecurity/trivy-action@v0.36.0
        if: always()
        with:
          scan-type: image
          image-ref: scan-target:latest
          scanners: vuln
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"
          format: sarif
          output: trivy-image.sarif
          ignore-unfixed: true

      - name: Upload image scan SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
        continue-on-error: true

  sbom-sign:
    name: SBOM Generation + Image Signing
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write  # Required for Cosign keyless signing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          format: spdx-json
          artifact-name: sbom-${{ github.sha }}.spdx.json
          output-file: sbom.spdx.json
          upload-artifact: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless via GitHub OIDC)
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}

      - name: Attach SBOM as attestation
        run: |
          cosign attest --yes \
            --type spdxjson \
            --predicate sbom.spdx.json \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}

  # ===========================================================================
  # Job 8: DAST (warn-only)
  # ===========================================================================
  dast:
    name: DAST (OWASP ZAP)
    needs: [image-scan, sbom-sign]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and tag application image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }} app:dast

      - name: Start application container
        run: |
          docker run -d \
            --name app-dast \
            -p 8000:8000 \
            -e ENVIRONMENT=testing \
            -e SECRET_KEY=zap-test-secret-key-32-bytes-min! \
            app:dast
          timeout 30 bash -c 'until curl -sf http://localhost:8000/health; do sleep 2; done'

      - name: Run OWASP ZAP baseline scan
        run: |
          mkdir -p security/zap-reports
          docker run --rm \
            --network host \
            -v ${{ github.workspace }}/security/zap-config.yaml:/zap/config.yaml:ro \
            -v ${{ github.workspace }}/security/zap-reports:/zap/reports \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t http://localhost:8000 \
              -c /zap/config.yaml \
              -r /zap/reports/zap-report.html \
              -J /zap/reports/zap-report.json \
              -I
        continue-on-error: true  # Warn-only until baseline established

      - name: Stop application container
        if: always()
        run: docker stop app-dast && docker rm app-dast

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report-${{ github.sha }}
          path: security/zap-reports/
          retention-days: 30

  # ===========================================================================
  # Job 9: Deployment gate (manual approval)
  # ===========================================================================
  deploy-gate:
    name: Deployment Gate
    needs: dast
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://api.example.com
    permissions:
      contents: read

    steps:
      - name: Deployment approved
        run: |
          echo "Approved by: ${{ github.actor }}"
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"
          echo "Commit: ${{ github.sha }}"
