name: Secure Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_NAME_LOWER: ghcr.io/mbitajeff/application-delivery-pipeline
  PYTHON_VERSION: "3.12"

jobs:

  # ---------------------------------------------------------------------------
  # Job 1: pre-flight — secret scan + lint
  # ---------------------------------------------------------------------------
  pre-flight:
    name: Pre-flight (Secrets + Lint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: security/.gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Ruff
        run: pip install ruff==0.17.4

      - name: Lint
        run: ruff check app/

  # ---------------------------------------------------------------------------
  # Jobs 2-4: parallel security analysis
  # ---------------------------------------------------------------------------
  sast:
    name: SAST (Semgrep)
    needs: pre-flight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/owasp-top-ten
            p/python
            p/jwt
            security/.semgrep.yml
          generateSarif: "1"
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true

  sca:
    name: SCA (Trivy filesystem)
    needs: pre-flight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: sarif
          output: trivy-sca.sarif
          ignore-unfixed: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-sca.sarif
          category: trivy-sca
        continue-on-error: true

  iac-scan:
    name: IaC Scan (Checkov)
    needs: pre-flight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infrastructure/
          config_file: security/checkov-config.yaml
          framework: terraform,kubernetes
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
          soft_fail: false

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov.sarif
          category: checkov
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # AWS Emulator integration tests: runs ALONGSIDE the security gates.
  # It is not part of the gate chain (no other job needs it), so the order
  # and behaviour of the 8 security gates are unchanged.
  # ---------------------------------------------------------------------------
  aws-emulator-tests:
    name: AWS Emulator Integration Tests
    needs: pre-flight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # No secrets are referenced in this job. The SDK is pointed at the local
    # emulator only; its keys are generated per run and masked in logs.
    # NOTE: the emulator does not evaluate IAM policies. Passing here is not
    # evidence that IAM permissions are correct (Checkov covers IaC IAM).
    env:
      AWS_ENDPOINT_URL: https://127.0.0.1:9297
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_DISABLE_HOST_PREFIX_INJECTION: "true"
      EMULATOR_TELEMETRY: "off"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Install AWS Emulator (official package, signature verified)
        run: bash scripts/aws-emulator/install-verified.sh

      - name: Guard against real AWS credentials
        run: |
          for var in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_PROFILE; do
            if [ -n "${!var+set}" ]; then
              echo "::error::${var} is set in the emulator job; refusing to continue."
              exit 1
            fi
          done
          echo "No real AWS credential variables present."

      - name: Start AWS Emulator and wait for health check
        run: bash scripts/aws-emulator/start.sh

      - name: Run AWS Emulator integration tests
        run: |
          unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_PROFILE
          python -m pytest app/tests/aws -m aws_emulator --no-cov \
            --junitxml=aws-emulator-junit.xml

      - name: Stop AWS Emulator
        if: always()
        run: bash scripts/aws-emulator/start.sh stop

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aws-emulator-junit-${{ github.sha }}
          path: aws-emulator-junit.xml
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Job 5: tests + coverage
  # ---------------------------------------------------------------------------
  test:
    name: Tests + Coverage
    needs: [sast, sca, iac-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Job 6: Docker build
  # ---------------------------------------------------------------------------
  build:
    name: Docker Build
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME_LOWER }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - name: Build image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Job 7a: image scan
  # ---------------------------------------------------------------------------
  image-scan:
    name: Image Scan (Trivy)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebuild image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: scan-target:latest
          cache-from: type=gha

      - name: Trivy image scan (table — visible in logs)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: scan-target:latest
          scanners: vuln
          severity: CRITICAL
          exit-code: "1"
          format: table
          ignore-unfixed: true

      - name: Trivy image scan (SARIF for Security tab)
        uses: aquasecurity/trivy-action@v0.36.0
        if: always()
        with:
          scan-type: image
          image-ref: scan-target:latest
          scanners: vuln
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"
          format: sarif
          output: trivy-image.sarif
          ignore-unfixed: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # Job 7b: SBOM generation + image signing
  # ---------------------------------------------------------------------------
  sbom-sign:
    name: SBOM + Image Signing
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ env.IMAGE_NAME_LOWER }}:sha-${{ github.sha }}
          cache-from: type=gha

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_NAME_LOWER }}:sha-${{ github.sha }}
          format: spdx-json
          artifact-name: sbom-${{ github.sha }}.spdx.json
          output-file: sbom.spdx.json
          upload-artifact: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image
        run: |
          cosign sign --yes \
            ${{ env.IMAGE_NAME_LOWER }}@${{ steps.push.outputs.digest }}

      - name: Attach SBOM attestation
        run: |
          cosign attest --yes \
            --type spdxjson \
            --predicate sbom.spdx.json \
            ${{ env.IMAGE_NAME_LOWER }}@${{ steps.push.outputs.digest }}

  # ---------------------------------------------------------------------------
  # Job 8: DAST (warn-only)
  # ---------------------------------------------------------------------------
  dast:
    name: DAST (OWASP ZAP)
    needs: [image-scan, sbom-sign]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull application image
        run: |
          docker pull ${{ env.IMAGE_NAME_LOWER }}:sha-${{ github.sha }}
          docker tag ${{ env.IMAGE_NAME_LOWER }}:sha-${{ github.sha }} app:dast

      - name: Start application
        run: |
          docker run -d \
            --name app-dast \
            -p 8000:8000 \
            -e ENVIRONMENT=testing \
            -e SECRET_KEY=zap-test-secret-key-32-bytes-min! \
            app:dast
          timeout 30 bash -c 'until curl -sf http://localhost:8000/health; do sleep 2; done'

      - name: Run OWASP ZAP baseline scan
        run: |
          mkdir -p security/zap-reports
          docker run --rm \
            --network host \
            -v ${{ github.workspace }}/security/zap-config.yaml:/zap/config.yaml:ro \
            -v ${{ github.workspace }}/security/zap-reports:/zap/reports \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t http://localhost:8000 \
              -c /zap/config.yaml \
              -r /zap/reports/zap-report.html \
              -J /zap/reports/zap-report.json \
              -I
        continue-on-error: true

      - name: Stop application
        if: always()
        run: docker stop app-dast && docker rm app-dast

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report-${{ github.sha }}
          path: security/zap-reports/
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Job 9: deployment gate (manual approval)
  # ---------------------------------------------------------------------------
  deploy-gate:
    name: Deployment Gate
    needs: dast
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://api.example.com
    permissions:
      contents: read
    steps:
      - name: Deployment approved
        run: |
          echo "Approved by: ${{ github.actor }}"
          echo "Image: ${{ env.IMAGE_NAME_LOWER }}:sha-${{ github.sha }}"

