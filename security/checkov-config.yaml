# Checkov configuration for IaC scanning.
# Every skipped check must have a documented justification.
# "It fails" is not an acceptable justification.
# Review this list quarterly. Remove skips when the underlying issue is fixed.

compact: false
output: cli
quiet: false
soft-fail: false  # Pipeline fails on HIGH findings

directory:
  - infrastructure/

framework:
  - terraform
  - kubernetes

skip-check:
  # ---------------------------------------------------------------------------
  # Kubernetes
  # ---------------------------------------------------------------------------

  # CKV_K8S_43: Image should use digest (not tag)
  # Justification: deployment.yaml uses a placeholder tag. The pipeline
  # substitutes the actual immutable SHA tag at deploy time via kubectl set image.
  - CKV_K8S_43

  # ---------------------------------------------------------------------------
  # Terraform — AWS
  # ---------------------------------------------------------------------------

  # CKV_AWS_38: EKS public endpoint not accessible to 0.0.0.0/0
  # Justification: endpoint_public_access = var.environment != "production"
  # In the local/staging environment the public endpoint is intentionally
  # enabled so engineers can access the cluster. It is disabled in production.
  # The check sees the conditional as a potential true value.
  # Review date: When cloud deployment is added, enforce public=false in prod only.
  - CKV_AWS_38

  # CKV_AWS_158: CloudWatch log group encrypted by KMS
  # Justification: VPC flow logs are operational/security data, not PII or secrets.
  # KMS encryption on a flow log group adds cost and operational complexity for
  # minimal security benefit. The KMS key already encrypts EKS secrets.
  # Review date: Reassess if compliance requirements (PCI, HIPAA) are added.
  - CKV_AWS_158

  # CKV_AWS_338: CloudWatch log group retains logs for at least 1 year
  # Justification: 90-day retention is appropriate for VPC flow logs used for
  # incident investigation. 1-year retention is a compliance requirement not yet
  # mandated for this project. Review if SOC2 or HIPAA compliance is added.
  - CKV_AWS_338

  # CKV_AWS_290: IAM policy allows write access without constraints
  # CKV_AWS_355: IAM policy allows "*" as resource for restrictable actions
  # CKV_AWS_111: IAM policy allows * for resource
  # CKV_AWS_356: IAM policy allows * for resource (duplicate check)
  # Justification: The VPC flow log IAM role uses Resource: "*" because
  # CloudWatch log group ARNs are not known at Terraform authoring time —
  # they are only available after the log group is created. This is the
  # documented AWS pattern for flow log IAM roles. The actions are scoped
  # to CloudWatch Logs only (logs:*), not AWS-wide admin actions.
  - CKV_AWS_290
  - CKV_AWS_355
  - CKV_AWS_111
  - CKV_AWS_356

  # CKV_AWS_260: Security group allows ingress on port 80
  # Justification: The ALB security group accepts HTTP on port 80 to perform
  # an HTTP→HTTPS redirect. Without this, users who type http:// get a
  # connection refused instead of being redirected. This is intentional and
  # standard practice for public-facing load balancers.
  - CKV_AWS_260

  # CKV2_AWS_5: Security groups are not attached to another resource
  # Justification: Checkov performs static analysis on Terraform HCL.
  # The ALB and app security groups are defined in the networking module
  # and passed as outputs to the compute module for attachment to the
  # EKS cluster and load balancer. Checkov cannot trace cross-module
  # references for this check.
  - CKV2_AWS_5

  # CKV2_AWS_12: Default VPC security group does not restrict all traffic
  # Justification: We create an explicit VPC and do not use the default VPC.
  # Checkov flags this because we don't explicitly add a
  # aws_default_security_group resource to lock down the default SG.
  # In a real deployment, add: resource "aws_default_security_group" "default"
  # with no ingress/egress rules. Acceptable for the local/non-deployed environment.
  - CKV2_AWS_12

  # CKV2_AWS_64: KMS key policy is not explicitly defined
  # Justification: When no key policy is defined, AWS applies the default
  # key policy which grants the account root full access and allows IAM
  # policies to control access. For EKS secrets encryption this is acceptable.
  # An explicit key policy would be added when IRSA or cross-account access is needed.
  - CKV2_AWS_64
