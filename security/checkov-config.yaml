# Checkov configuration for IaC scanning.
# Every skipped check must have a documented justification.
# "It fails" is not an acceptable justification.

compact: false
output: cli
quiet: false
soft-fail: false  # Pipeline fails on HIGH findings

# Directories to scan
directory:
  - infrastructure/

# Frameworks to scan
framework:
  - terraform
  - kubernetes

# =============================================================================
# Skipped checks with justifications
# =============================================================================
# Format: CHECK_ID: justification
#
# Review this list quarterly. Remove skips when the underlying issue is fixed.

skip-check:
  # CKV_K8S_43: Image should use digest (not tag)
  # Justification: We use SHA-based tags (sha-abc1234) in production.
  # The deployment.yaml uses "latest" as a placeholder — the pipeline
  # overwrites this with the actual SHA tag at deploy time.
  - CKV_K8S_43

  # CKV_AWS_111: IAM policy allows * for resource
  # Justification: The VPC flow log IAM policy uses * because CloudWatch
  # log group ARNs are only known at apply time. This is the documented
  # AWS pattern for flow log IAM roles.
  - CKV_AWS_111

  # CKV_AWS_356: IAM policy allows * for resource (duplicate of above)
  - CKV_AWS_356
